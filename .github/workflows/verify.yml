name: Verify

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used to enforce the CRAP baseline ratchet
        required: false
        type: string
      publish_badge:
        description: Publish the CRAP badge after a successful manual run
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Build dispatcher
        shell: bash
        run: ./build-rust-dispatcher.sh
      - name: Run Rust tests
        shell: bash
        run: cargo test --manifest-path rust/dispatcher/Cargo.toml --all-targets
      - name: Run sanitization checks
        shell: bash
        run: bash test/sanitize/run.sh
      - name: Run commit policy tests
        shell: bash
        run: node --test .github/scripts/commit-policy.test.js
      - name: Run sync workflow tests
        shell: bash
        run: node --test .github/scripts/sync-workflow.test.js
      - name: Run release workflow tests
        shell: bash
        run: node --test .github/scripts/release-workflow.test.js
      - name: Run Smart Merge policy tests
        shell: bash
        run: node --test .github/scripts/smart-merge-policy.test.js
      - name: Run workflow security tests
        shell: bash
        run: node --test .github/scripts/workflow-security.test.js
      - name: Run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/makevn-smoke"
          MAKEVN_KEEP_SMOKE_TMP=1 TMPDIR="${RUNNER_TEMP}/makevn-smoke" bash test/smoke/run.sh
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-artifacts
          path: ${{ runner.temp }}/makevn-smoke
          if-no-files-found: ignore

  crap:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Build dispatcher
        shell: bash
        run: ./build-rust-dispatcher.sh
      - name: Run CRAP workflow tests
        shell: bash
        run: node --test .github/scripts/crap-workflow.test.js
      - name: Run CRAP reporter tests
        shell: bash
        run: python3 -m unittest tools.crap.test_report
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'
      - name: Install CRAP analysis tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install cargo-crap --version 0.4.3 --locked
          gem install bashcov --version 3.1.3 --no-document
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/shellspec/shellmetrics/b3bfff2af6880443112cdbf2ea449440b30ab9b0/shellmetrics \
            --output "${RUNNER_TEMP}/shellmetrics"
          echo "1aab5caf551811a506f11e569a1c4cf00ddd960d9212428531efb075f45d0a5d  ${RUNNER_TEMP}/shellmetrics" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/shellmetrics"
      - name: Prepare base CRAP baseline
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_ref != '')
        shell: bash
        env:
          CRAP_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}
        run: |
          if ! git show "origin/${CRAP_BASE_REF}:tools/crap/baseline.json" > "${RUNNER_TEMP}/crap-base-baseline.json"; then
            cp tools/crap/baseline.json "${RUNNER_TEMP}/crap-base-baseline.json"
          fi
      - name: Run CRAP ratchet
        shell: bash
        env:
          SHELLMETRICS: ${{ runner.temp }}/shellmetrics
        run: |
          set -euo pipefail
          args=()
          if [[ -f "${RUNNER_TEMP}/crap-base-baseline.json" ]]; then
            args+=(--base-baseline "${RUNNER_TEMP}/crap-base-baseline.json")
          fi
          tools/crap/run.sh "${args[@]}"
      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crap-reports
          path: target/crap
          if-no-files-found: error

  publish-crap-badge:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_badge) || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs: crap
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crap-reports
          path: crap-reports
      - name: Prepare badge artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          cp crap-reports/badge.json pages/crap-badge.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
      - name: Deploy badge to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
