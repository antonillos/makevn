name: Verify

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Build dispatcher
        shell: bash
        run: ./build-rust-dispatcher.sh
      - name: Run Rust tests
        shell: bash
        run: cargo test --manifest-path rust/dispatcher/Cargo.toml --all-targets
      - name: Run sanitization checks
        shell: bash
        run: bash test/sanitize/run.sh
      - name: Run commit policy tests
        shell: bash
        run: node --test .github/scripts/commit-policy.test.js
      - name: Run sync workflow tests
        shell: bash
        run: node --test .github/scripts/sync-workflow.test.js
      - name: Run release workflow tests
        shell: bash
        run: node --test .github/scripts/release-workflow.test.js
      - name: Run Smart Merge policy tests
        shell: bash
        run: node --test .github/scripts/smart-merge-policy.test.js
      - name: Run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/makevn-smoke"
          MAKEVN_KEEP_SMOKE_TMP=1 TMPDIR="${RUNNER_TEMP}/makevn-smoke" bash test/smoke/run.sh
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-artifacts
          path: ${{ runner.temp }}/makevn-smoke
          if-no-files-found: ignore
