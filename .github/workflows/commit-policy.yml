name: Commit Policy

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to validate
        required: true
        type: number
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string
      base_sha:
        description: Expected pull request base SHA
        required: true
        type: string
      base_ref:
        description: Expected pull request base branch
        required: true
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: commit-policy-${{ github.event.pull_request.number || github.event.inputs.pull_number || github.run_id }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits and signatures
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # API metadata only: no checkout, PR code execution, signing key or CRAP.
      - name: Validate every PR commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/;
            const policyIntroducedSha = "0e1b4ce8c548dac16dc019b046bd3b04a97e9aff";
            function conventional(message, isMergeCommit = false) {
              if (typeof message !== "string") return false;
              const lines = message.replace(/\r\n/g, "\n").split("\n");
              const mergeHeader = /^Merge (?:pull request #\d+ from \S+|(?:remote-tracking )?branch .+ into \S+)$/i;
              if (mergeHeader.test(lines[0])) return isMergeCommit && (lines.length === 1 || lines[1] === "");
              // Types are extensible and case-insensitive; scope and ! are optional.
              const header = /^[a-z][a-z0-9-]*(?:\(([^()\r\n]+)\))?!?: \S[^\r\n]*$/i.exec(lines[0]);
              return header !== null && (header[1] === undefined || header[1].trim() !== "") &&
                (lines.length === 1 || lines[1] === "");
            }
            let validationFailed = true;
            let dispatchCheckId = null;
            try {
              const fromDispatch = context.eventName === "workflow_dispatch";
              const event = context.payload.pull_request;
              const inputs = context.payload.inputs || {};
              const pullNumber = fromDispatch ? Number(inputs.pull_number) : event?.number;
              const expectedHeadSha = fromDispatch ? inputs.head_sha : event?.head?.sha;
              const expectedBaseSha = fromDispatch ? inputs.base_sha : event?.base?.sha;
              const expectedBaseRef = fromDispatch ? inputs.base_ref : event?.base?.ref;
              if (!Number.isInteger(pullNumber) ||
                  !shaPattern.test(expectedHeadSha || "") ||
                  !shaPattern.test(expectedBaseSha || "") ||
                  typeof expectedBaseRef !== "string" || expectedBaseRef.length === 0) {
                core.setFailed("An explicit pull request revision is required.");
                return;
              }
              const needsExplicitCheck = fromDispatch || context.eventName === "pull_request_target";
              if (needsExplicitCheck) {
                const check = await github.rest.checks.create({
                  ...context.repo,
                  name: "Conventional Commits and signatures",
                  head_sha: expectedHeadSha,
                  status: "in_progress",
                  started_at: new Date().toISOString(),
                  output: {
                    title: "Commit policy validation",
                    summary: "Validating the explicit pull request revision.",
                  },
                });
                dispatchCheckId = check.data.id;
              }
              const params = { ...context.repo, pull_number: pullNumber };
              const { data: before } = await github.rest.pulls.get(params);
              const sameRevision = (pull) => pull.head.sha === expectedHeadSha &&
                pull.base.sha === expectedBaseSha && pull.base.ref === expectedBaseRef;
              if (!sameRevision(before)) {
                core.setFailed("PR revision changed; use the check for the current revision.");
                return;
              }
              // GitHub's PR-commits endpoint is capped at 250 even with pagination.
              if (!Number.isInteger(before.commits) || before.commits < 1 || before.commits > 250) {
                core.setFailed("Cannot verify the complete commit set (supported range: 1–250).");
                return;
              }
              const commits = await github.paginate(github.rest.pulls.listCommits,
                { ...params, per_page: 100 });
              const shas = commits.map((commit) => commit.sha);
              if (shas.length !== before.commits || new Set(shas).size !== shas.length ||
                  !shas.every((sha) => typeof sha === "string" && shaPattern.test(sha)) ||
                  !shas.includes(expectedHeadSha)) {
                core.setFailed("Complete commit metadata is unavailable; no passing result can be issued.");
                return;
              }
              let failed = 0;
              if (!conventional(before.title)) {
                core.error("Pull request title must follow Conventional Commits format.");
                failed++;
              }
              // The policy was introduced while develop already contained older,
              // signed commits. Keep those commits as legacy for this migration;
              // once the policy commit is an ancestor of the base branch, all PR
              // commits are validated because this cutoff is absent from `shas`.
              const policyIndex = shas.indexOf(policyIntroducedSha);
              const commitsToValidate = policyIndex >= 0 ? shas.slice(policyIndex) : shas;
              for (const sha of commitsToValidate) {
                const { data: commit } = await github.rest.repos.getCommit({
                  ...context.repo, ref: sha,
                });
                if (commit.sha !== sha) throw new Error("Commit mismatch");
                const message = commit.commit?.message;
                const isMergeCommit = Array.isArray(commit.parents) && commit.parents.length > 1;
                const formatOK = conventional(message, isMergeCommit);
                const verification = commit.commit?.verification;
                const signature = verification?.signature;
                const signatureOK = verification?.verified === true &&
                  verification.reason === "valid" &&
                  (signature?.startsWith("-----BEGIN SSH SIGNATURE-----") === true ||
                    signature?.startsWith("-----BEGIN PGP SIGNATURE-----") === true);
                // Never echo messages, identities, signatures, payloads or API errors.
                if (!formatOK) core.error(`${sha.slice(0, 12)}: Conventional Commits format required.`);
                if (!signatureOK) core.error(`${sha.slice(0, 12)}: verified PGP or SSH signature required.`);
                if (!formatOK || !signatureOK) failed++;
              }
              const { data: after } = await github.rest.pulls.get(params);
              if (!sameRevision(after) || after.commits !== before.commits ||
                  after.title !== before.title) {
                core.setFailed("PR revision changed during validation; results are stale.");
                return;
              }
              await core.summary.addHeading("Commit policy")
                .addRaw(`Checked ${shas.length} commits; ${failed} failed.\n`).write();
              validationFailed = failed > 0;
              if (failed) core.setFailed("Commit policy failed; see the commit SHA diagnostics.");
            } catch {
              core.setFailed("Commit metadata or signature verification could not be checked. Try again when available.");
            } finally {
              if (dispatchCheckId) {
                try {
                  await github.rest.checks.update({
                    ...context.repo,
                    check_run_id: dispatchCheckId,
                    status: "completed",
                    conclusion: validationFailed ? "failure" : "success",
                    completed_at: new Date().toISOString(),
                    output: {
                      title: "Commit policy validation",
                      summary: validationFailed
                        ? "Commit policy validation failed."
                        : "Commit policy validation passed.",
                    },
                  });
                } catch {
                  core.warning("Could not finalize the PR-head commit policy check.");
                }
              }
            }
