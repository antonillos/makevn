name: Smart Merge Command

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/merge')
    concurrency:
      group: smart-merge-${{ github.repository }}-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - name: Analyze and merge pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.issue.number;
            const actor = context.actor.toLowerCase();
            const command = context.payload.comment.body.trim().split(/\s+/);
            const allowedOverrides = new Set(["merge", "squash", "rebase"]);
            const githubApiRequest = {
              headers: { "X-GitHub-Api-Version": "2026-03-10" },
            };
            const requestedMethod = command[1] || "";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function comment(message) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: message,
              });
            }

            if (command[0] !== "/merge" || command.length > 2 ||
                (requestedMethod && !allowedOverrides.has(requestedMethod))) {
              await comment(
                "Usage: `/merge` or `/merge merge|squash|rebase`. " +
                "Without an override I will choose the safest strategy."
              );
              return;
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: actor,
            });
            if (!["admin", "maintain", "write"].includes(permission.data.permission)) {
              await comment(`⛔ @${actor} does not have permission to merge this pull request.`);
              core.setFailed("The command author lacks write permission.");
              return;
            }

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

            const pullResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const pull = pullResponse.data;

            if (pull.draft) {
              await comment("⛔ This pull request is still a draft.");
              return;
            }
            if (pull.state !== "open") {
              await comment(`⛔ Pull request is ${pull.state}; nothing was merged.`);
              return;
            }
            if (pull.mergeable === false) {
              await comment("⛔ This pull request has merge conflicts.");
              return;
            }

            // The asynchronous endpoint merges every PR in a stack up to the
            // requested one. Discover that exact set now so every affected PR
            // receives the same fail-closed validation before one is merged.
            let stackResponse;
            try {
              stackResponse = await github.request(
                "GET /repos/{owner}/{repo}/stacks",
                {
                  owner,
                  repo,
                  pull_request: pullNumber,
                  per_page: 2,
                  ...githubApiRequest,
                }
              );
            } catch (error) {
              await comment(
                "⛔ Could not verify GitHub stack membership, so no merge was attempted. " +
                "Retry `/merge` after GitHub API access recovers."
              );
              core.setFailed(`Could not verify pull request stack: ${error.message}`);
              return;
            }
            if (stackResponse.data.length > 1) {
              await comment("⛔ GitHub returned multiple stacks for this pull request.");
              core.setFailed("Ambiguous pull request stack membership.");
              return;
            }
            const stack = stackResponse.data[0];
            let targetPulls = [pull];
            if (stack) {
              const stackIndex = stack.pull_requests.findIndex((item) =>
                item.number === pullNumber
              );
              const stackPull = stack.pull_requests[stackIndex];
              if (!stackPull || stackPull.head.sha !== pull.head.sha) {
                await comment(
                  "⛔ The GitHub stack changed while Smart Merge was starting. " +
                  "Run `/merge` again."
                );
                core.setFailed("Pull request stack changed.");
                return;
              }

              const targetItems = stack.pull_requests
                .slice(0, stackIndex + 1)
                .filter((item) => !item.merged_at);
              targetPulls = [];
              for (const item of targetItems) {
                const target = item.number === pullNumber
                  ? pull
                  : (await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: item.number,
                    })).data;
                if (target.state !== "open" || target.draft ||
                    target.head.sha !== item.head.sha) {
                  await comment(
                    `⛔ Stack PR #${item.number} is closed, draft, or changed. ` +
                    "Make every PR ready, then run `/merge` again."
                  );
                  core.setFailed(`Stack PR #${item.number} is not ready.`);
                  return;
                }
                targetPulls.push(target);
              }
            }

            // Smoke and CRAP are the stable branch-protection gates for makevn.
            // Together they validate the exact head SHA through Verify.
            const requiredChecks = ["smoke", "crap"];
            const deadline = Date.now() + 30 * 60 * 1000;

            async function loadRequiredJobs(runId) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner,
                  repo,
                  run_id: runId,
                  per_page: 100,
                }
              );
              const jobsByName = new Map(jobs.map((job) => [job.name, job]));
              const invalid = requiredChecks.filter((name) => {
                const job = jobsByName.get(name);
                return !job || job.status !== "completed" ||
                  job.conclusion !== "success";
              });
              return { jobsByName, invalid };
            }

            async function findSuccessfulVerify(target) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "verify.yml",
                event: "pull_request",
                branch: target.head.ref,
                status: "success",
                per_page: 20,
              });
              for (const candidate of runs.data.workflow_runs) {
                if (candidate.head_sha !== target.head.sha) continue;
                const candidateJobs = await loadRequiredJobs(candidate.id);
                if (!candidateJobs.invalid.length) return candidate;
              }
              return null;
            }

            // Reuse a complete successful pull_request run only when it belongs
            // to the immutable PR head being validated. This avoids repeating
            // expensive checks without ever mixing jobs from different SHAs or
            // workflow runs.
            for (const target of targetPulls) {
              if (target.number === pullNumber) continue;
              if (!await findSuccessfulVerify(target)) {
                await comment(
                  `⛔ Stack PR #${target.number} has no successful Verify run for ` +
                  `\`${target.head.sha.slice(0, 12)}\`. Run Verify for that PR, then retry \`/merge\`.`
                );
                core.setFailed(`Stack PR #${target.number} is not verified.`);
                return;
              }
            }
            let verifyRun = await findSuccessfulVerify(pull);

            // PRs created by GITHUB_TOKEN do not reliably start a usable
            // pull_request run. Dispatch and track one exact Verify run only
            // when no complete successful run exists for this head.
            if (!verifyRun) {
              const dispatchStartedAt = Date.now();
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "verify.yml",
                ref: pull.head.ref,
                inputs: {
                  base_ref: pull.base.ref,
                  publish_badge: "false",
                },
                request: githubApiRequest,
              });

              while (Date.now() < deadline && !verifyRun) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "verify.yml",
                  event: "workflow_dispatch",
                  branch: pull.head.ref,
                  per_page: 20,
                });
                verifyRun = runs.data.workflow_runs.find((run) =>
                  run.head_sha === pull.head.sha &&
                  new Date(run.created_at).getTime() >= dispatchStartedAt - 5000
                );
                if (!verifyRun) await sleep(5000);
              }
            }

            if (!verifyRun) {
              await comment("⏳ Timed out waiting for a usable Verify run.");
              core.setFailed("Verify run did not start.");
              return;
            }

            while (verifyRun.status !== "completed" && Date.now() < deadline) {
              await sleep(15000);
              verifyRun = (await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: verifyRun.id,
              })).data;
            }

            if (verifyRun.status !== "completed") {
              await comment("⏳ Timed out waiting for the Verify run.");
              core.setFailed("Verify run timed out.");
              return;
            }

            const { jobsByName, invalid } = await loadRequiredJobs(verifyRun.id);
            if (verifyRun.conclusion !== "success" || invalid.length) {
              await comment(
                `⛔ Verify run failed: ${invalid.map((name) => {
                  const job = jobsByName.get(name);
                  return `\`${name}\` (${job?.conclusion || "missing"})`;
                }).join(", ")}.\n\nRun: ${verifyRun.html_url}`
              );
              core.setFailed("Verify run failed.");
              return;
            }

            // Required-workflow rules can require the pull_request run in
            // addition to the explicit workflow_dispatch validation above.
            // Wait until GitHub reports that every branch requirement is
            // satisfied instead of attempting the merge while checks are still
            // shown as expected.
            // A bot approval can be required for protected branches. The
            // reviewer identity is github-actions[bot], not the user who wrote
            // /merge, so it can approve that user's PR. Only skip a PR authored
            // by the workflow identity itself.
            const workflowBot = "github-actions[bot]";
            for (const target of targetPulls) {
              const targetAuthor = target.user.login.toLowerCase();
              const targetAuthorIsWorkflowBot = targetAuthor === workflowBot;
              if (targetAuthorIsWorkflowBot) {
                core.info(
                  `Skipping bot approval for PR #${target.number} because @${targetAuthor} is the workflow identity.`
                );
                continue;
              }

              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: target.number,
                  event: "APPROVE",
                  body: `Approved by the smart merge command requested by @${actor}.`,
                });
              } catch (error) {
                core.warning(`Could not submit bot approval for PR #${target.number}: ${error.message}`);
              }
            }

            const readyPulls = new Map();
            let allPullsReady = false;
            while (Date.now() < deadline) {
              allPullsReady = true;
              for (const target of targetPulls) {
                const current = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: target.number,
                })).data;
                readyPulls.set(target.number, current);
                if (current.head.sha !== target.head.sha) {
                  await comment(
                    target.number === pullNumber
                      ? "⛔ The PR head changed during validation. Run `/merge` again."
                      : `⛔ Stack PR #${target.number} changed during validation. ` +
                        "Run `/merge` again."
                  );
                  core.setFailed(`Stack PR #${target.number} head changed during validation.`);
                  return;
                }
                if (current.mergeable === false) {
                  await comment(
                    `⛔ Stack PR #${target.number} developed merge conflicts during validation.`
                  );
                  core.setFailed(`Stack PR #${target.number} has merge conflicts.`);
                  return;
                }
                if (current.mergeable_state !== "clean") allPullsReady = false;
              }
              if (allPullsReady) break;
              await sleep(15000);
            }

            if (!allPullsReady) {
              await comment(
                "⏳ Timed out waiting for GitHub branch requirements to become mergeable."
              );
              core.setFailed("Branch requirements did not become mergeable.");
              return;
            }

            for (const target of targetPulls) {
              const current = readyPulls.get(target.number);
              if (current.head.sha !== target.head.sha ||
                  current.base.ref !== target.base.ref ||
                  current.mergeable_state !== "clean") {
                await comment(
                  `⛔ Stack PR #${target.number} changed or is no longer mergeable. ` +
                  "Resolve it, then run `/merge` again."
                );
                core.setFailed(`Stack PR #${target.number} is no longer ready.`);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: target.number,
                per_page: 100,
              });
              const unverified = commits.filter((commit) =>
                !commit.commit.verification?.verified
              );
              if (unverified.length) {
                await comment(
                  `⛔ Stack PR #${target.number} has unverified commits: ` +
                  `${unverified.map((commit) =>
                    `\`${commit.sha.slice(0, 12)}\``).join(", ")}.`
                );
                core.setFailed(`Stack PR #${target.number} contains unverified commits.`);
                return;
              }
            }

            const base = stack?.base.ref || pull.base.ref;
            const head = pull.head.ref;
            const policies = targetPulls.map((target) => {
              const targetTitle = target.title.toLowerCase();
              const targetAuthor = target.user.login.toLowerCase();
              const targetBase = target.base.ref;
              const targetHead = target.head.ref;
              return {
                historySync:
                  target.changed_files === 0 ||
                  targetHead.startsWith("sync/") ||
                  (targetBase === "develop" && targetHead === "main") ||
                  targetTitle.includes("sync main into develop"),
                longLivedPromotion:
                  targetBase === "main" &&
                  ["develop", "staging"].includes(targetHead),
                dependencyUpdate:
                  targetAuthor.includes("dependabot") ||
                  targetAuthor.includes("renovate") ||
                  targetTitle.startsWith("chore(deps)"),
              };
            });
            const historySync = policies.some((policy) => policy.historySync);
            const longLivedPromotion = policies.some((policy) =>
              policy.longLivedPromotion
            );
            const dependencyUpdate = policies.every((policy) =>
              policy.dependencyUpdate
            );

            let method = "squash";
            let reason = targetPulls.length > 1
              ? `validated stack of ${targetPulls.length} pull requests`
              : "focused feature or maintenance change";
            if (historySync) {
              method = "merge";
              reason = "history synchronization must preserve ancestry";
            } else if (longLivedPromotion) {
              method = "merge";
              reason = "long-lived branch promotion must preserve source commits";
            } else if (dependencyUpdate) {
              method = "squash";
              reason = "atomic dependency update";
            }

            if (requestedMethod) {
              if ((historySync || longLivedPromotion) && requestedMethod !== "merge") {
                await comment(
                  `⛔ Refusing \`${requestedMethod}\`: this PR requires a merge commit ` +
                  "to preserve branch ancestry."
                );
                core.setFailed("Unsafe strategy override.");
                return;
              }
              method = requestedMethod;
              reason = `explicit override requested by @${actor}`;
            }

            // Refresh immediately before merging to avoid merging a stale head.
            const refreshed = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            })).data;
            if (refreshed.head.sha !== pull.head.sha) {
              await comment("⛔ The PR head changed during validation. Run `/merge` again.");
              core.setFailed("Pull request head changed during validation.");
              return;
            }

            for (const target of targetPulls) {
              const current = target.number === pullNumber
                ? refreshed
                : (await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: target.number,
                  })).data;
              if (current.head.sha !== target.head.sha ||
                  current.base.ref !== target.base.ref ||
                  current.state !== "open") {
                await comment(
                  `⛔ Stack PR #${target.number} changed immediately before merging. ` +
                  "Run `/merge` again."
                );
                core.setFailed(`Stack PR #${target.number} changed before merge.`);
                return;
              }
            }

            const mergeOptions = {
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: method,
              merge_action: "default",
              expected_head_sha: pull.head.sha,
              ...githubApiRequest,
            };
            if (method === "squash") {
              mergeOptions.commit_title = pull.title;
            }

            let mergeRequest;
            try {
              mergeRequest = await github.request(
                "PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge-async",
                mergeOptions
              );
            } catch (error) {
              if (error.status === 409 && error.response?.data) {
                mergeRequest = error.response;
              } else {
                await comment(
                  `⛔ GitHub refused the merge: ${error.response?.data?.details?.message || `HTTP ${error.status || "error"}`}. ` +
                  "Resolve the reported condition, then run `/merge` again."
                );
                core.setFailed(`Asynchronous merge request failed: ${error.message}`);
                return;
              }
            }

            let mergeResult = mergeRequest.data;
            if (mergeRequest.status === 409) {
              const existing = mergeResult.details || {};
              if (existing.expected_head_sha !== pull.head.sha ||
                  existing.merge_method !== method) {
                await comment(
                  "⛔ A different asynchronous merge request already exists. " +
                  "Wait for it to finish, then run `/merge` again."
                );
                core.setFailed("Conflicting asynchronous merge request.");
                return;
              }
            }

            let mergeSha = mergeResult.status === "merged"
              ? mergeResult.details?.sha
              : null;
            const mergeUuid = mergeResult.details?.uuid;
            if (!mergeSha && !mergeUuid) {
              await comment(
                `⛔ GitHub refused the merge: ${mergeResult.details?.message || "unknown error"}`
              );
              core.setFailed("Asynchronous merge was not accepted.");
              return;
            }

            const mergeDeadline = Date.now() + 30 * 60 * 1000;
            while (!mergeSha && Date.now() < mergeDeadline) {
              await sleep(5000);
              mergeResult = (await github.request(
                "GET /repos/{owner}/{repo}/pulls/{pull_number}/merge-async/{uuid}",
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  uuid: mergeUuid,
                  ...githubApiRequest,
                }
              )).data;

              if (mergeResult.status === "merged") {
                mergeSha = mergeResult.details?.sha;
              } else if (mergeResult.status === "failed") {
                await comment(
                  `⛔ GitHub refused the merge: ${mergeResult.details?.message || "unknown error"}`
                );
                core.setFailed("Asynchronous merge failed.");
                return;
              } else if (!["pending", "enqueued"].includes(mergeResult.status)) {
                await comment(
                  `⛔ GitHub returned an unknown merge status: \`${mergeResult.status}\`.`
                );
                core.setFailed("Unknown asynchronous merge status.");
                return;
              }
            }

            if (!mergeSha) {
              await comment("⏳ Timed out waiting for GitHub to finish the merge.");
              core.setFailed("Asynchronous merge timed out.");
              return;
            }

            await sleep(2000);
            const resultCommit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: mergeSha,
            });
            const verification = resultCommit.data.commit.verification;

            // Pushes performed with GITHUB_TOKEN do not trigger downstream
            // push workflows. Explicitly dispatch Release for release PRs so
            // publishing does not depend on a manual workflow run.
            const releaseMatch = head.match(/^release\/(v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$/i);
            if (base === "main" && releaseMatch) {
              const version = releaseMatch[1];
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: "release.yml",
                  ref: "main",
                  inputs: {
                    version,
                    prerelease: version.includes("-") ? "true" : "false",
                    draft: "false",
                  },
                });
                await comment(`🚀 Release workflow dispatched for \`${version}\`.`);
              } catch (error) {
                core.warning(`Could not dispatch Release for ${version}: ${error.message}`);
                await comment(
                  `⚠️ Merge completed, but Release could not be dispatched for \`${version}\`. ` +
                  "Run the Release workflow manually."
                );
              }

              // A Release dispatched with GITHUB_TOKEN does not reliably emit
              // workflow_run for the sync workflow. Dispatch it explicitly so
              // main is always synchronized back into develop after release.
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: "sync-main-to-develop.yml",
                  ref: "develop",
                  request: githubApiRequest,
                });
                await comment("🔄 Main-to-develop sync dispatched after the release.");
              } catch (error) {
                core.warning(`Could not dispatch Main To Develop sync: ${error.message}`);
                await comment(
                  "⚠️ Release was dispatched, but Main To Develop sync could not be dispatched; " +
                  "run the sync workflow manually."
                );
              }
            }

            for (const target of targetPulls) {
              const targetHead = target.head.ref;
              const disposable =
                target.head.repo?.full_name === `${owner}/${repo}` &&
                !["main", "develop", "staging"].includes(targetHead);
              if (disposable) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${targetHead}`,
                  });
                } catch (error) {
                  core.warning(`Could not delete ${targetHead}: ${error.message}`);
                }
              }
            }

            const mergedScope = targetPulls.length > 1
              ? `stack ${targetPulls.map((target) => `#${target.number}`).join(" → ")}`
              : `pull request #${pullNumber}`;
            await comment(
              `✅ Merged ${mergedScope} with **${method}** (${reason}).\n\n` +
              `Commit: \`${mergeSha.slice(0, 12)}\`\n` +
              `Signature: ${verification?.verified ? "verified" : "not verified"}`
            );
