<svg xmlns="http://www.w3.org/2000/svg" width="340" height="74" viewBox="0 0 340 74" role="img" aria-labelledby="title desc">
  <title id="title">makevn wordmark</title>
  <desc id="desc">makevn wordmark with vn muted in gray.</desc>
  <defs>
    <style>
      .wordmark {
        font: 800 58px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      .wordmark-main { fill: #0f172a; }
      .wordmark-muted { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .wordmark-main { fill: #f8fafc; }
      }
    </style>
  </defs>

  <text class="wordmark" x="170" y="58" text-anchor="middle">
    <tspan class="wordmark-main">make</tspan><tspan class="wordmark-muted">vn</tspan>
  </text>
</svg>
