[package]
name = "makevn-dispatcher"
version = "0.1.0-dev"
edition = "2021"
publish = false

[[bin]]
name = "makevn"
path = "src/main.rs"

[[bin]]
name = "makevn-mcp"
path = "src/main.rs"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
